<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Game</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #228b22;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    touch-action: none;
  }
  h1 {
    margin: 10px 0;
  }
  #gameCanvas {
    border: 4px solid #333;
    background: #52864a;
    touch-action: none;
    max-width: 90vw;
    max-height: 60vh;
  }
  #info {
    margin: 10px 0;
    font-size: 18px;
    text-align: center;
  }
  #highScoreDisplay {
    font-size: 14px;
    color: #cccccc;
    margin-top: 2px;
  }
  #overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #overlayBox {
    color: white;
    text-align: center;
    font-size: 28px;
    background: rgba(0,0,0,0.75);
    padding: 20px 40px;
    border-radius: 10px;
  }
  #overlayBox.win #overlayText {
    color: gold;
    font-weight: bold;
  }
  #overlayBox button {
    display: block;
    width: 100%;
  }
  #settingsBtn {
    background: #444;
  }
  #settingsOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #settingsBox {
    color: white;
    text-align: center;
    font-size: 22px;
    background: rgba(0,0,0,0.85);
    padding: 24px 36px;
    border-radius: 10px;
  }
  #settingsBox p {
    font-size: 14px;
    color: #cccccc;
    max-width: 260px;
    margin: 4px auto 14px auto;
  }
  .sizeBtn {
    display: block;
    width: 100%;
    margin-top: 10px;
    text-align: left;
    background: #2f6ff0;
  }
  .sizeBtn.active {
    background: #1a4fd6;
    box-shadow: inset 0 0 0 2px white;
  }
  #wrapper {
    position: relative;
    display: flex;
  }
  button {
    margin-top: 10px;
    padding: 8px 16px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #2f6ff0;
    color: white;
  }
  button:hover {
    filter: brightness(1.15);
  }
</style>
</head>
<body>

<h1>🐍 Snake Game</h1>
<div id="info">
  <div>Point: <span id="score">0</span></div>
  <div id="highScoreDisplay">Highscore: <span id="highScore">0</span></div>
</div>

<div id="wrapper">
  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <div id="overlay">
    <div id="overlayBox">
      <div id="overlayText">Game Over!</div>
      <button onclick="restartGame()">Play again</button>
      <button id="settingsBtn" onclick="openSettings()">Settings</button>
    </div>
  </div>

  <div id="settingsOverlay">
    <div id="settingsBox">
      <div>Vælg banestørrelse</div>
      <p>Et mindre bræt betyder større firkanter og en langsommere slange, så du ikke rammer væggen med det samme.</p>
      <button class="sizeBtn" data-size="large" onclick="chooseSize('large')">Large (20 x 20)</button>
      <button class="sizeBtn" data-size="medium" onclick="chooseSize('medium')">Medium (15 x 15)</button>
      <button class="sizeBtn" data-size="small" onclick="chooseSize('small')">Small (10 x 10)</button>
      <button onclick="closeSettings()">Tilbage</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const SIZE_PRESETS = {
  large:  {tileCount: 20, tickInterval: 120},
  medium: {tileCount: 15, tickInterval: 160},
  small:  {tileCount: 10, tickInterval: 200}
};

let currentSizeKey = 'medium';
let tileCount, gridSize, tickInterval;

let snake, previousSnake, direction, nextDirection, apple, score, highScore, gameOver, gameLoop;
let lastTickTime = 0;

highScore = 0;

function applySizePreset(key) {
  currentSizeKey = key;
  const preset = SIZE_PRESETS[key];
  tileCount = preset.tileCount;
  gridSize = canvas.width / tileCount;
  tickInterval = preset.tickInterval;
}

function initGame() {
  applySizePreset(currentSizeKey);

  const start = {x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2)};
  snake = [start];
  previousSnake = [{x: start.x, y: start.y}];
  direction = {x: 0, y: 0};
  nextDirection = {x: 0, y: 0};
  score = 0;
  gameOver = false;
  document.getElementById('score').textContent = score;
  document.getElementById('highScore').textContent = highScore;
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('settingsOverlay').style.display = 'none';
  document.getElementById('overlayBox').classList.remove('win');
  placeApple();
  if (gameLoop) clearInterval(gameLoop);
  lastTickTime = performance.now();
  gameLoop = setInterval(tick, tickInterval);
}

function placeApple() {
  let valid = false;
  while (!valid) {
    apple = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
    valid = !snake.some(seg => seg.x === apple.x && seg.y === apple.y);
  }
}

function drawBackground() {
  for (let y = 0; y < tileCount; y++) {
    for (let x = 0; x < tileCount; x++) {
      const light = (x + y) % 2 === 0;
      ctx.fillStyle = light ? '#5e9955' : '#468038';
      ctx.fillRect(x * gridSize, y * gridSize, gridSize, gridSize);
    }
  }
}

function drawSnake(t) {
  // Slangen har én ensartet mørkeblå farve, ligesom hovedet, og
  // firkanterne tegnes uden nogen streg imellem sig.
  ctx.fillStyle = '#3f82f5';

  for (let i = snake.length - 1; i >= 0; i--) {
    const end = snake[i];
    const start = i < previousSnake.length ? previousSnake[i] : end;
    const x = start.x + (end.x - start.x) * t;
    const y = start.y + (end.y - start.y) * t;

    ctx.fillRect(x * gridSize, y * gridSize, gridSize, gridSize);
  }
}

function drawApple() {
  ctx.fillStyle = '#e6291f';
  const cx = apple.x * gridSize + gridSize / 2;
  const cy = apple.y * gridSize + gridSize / 2;
  ctx.beginPath();
  ctx.arc(cx, cy, gridSize / 2 - 2, 0, Math.PI * 2);
  ctx.fill();
}

function tick() {
  if (gameOver) return;

  direction = nextDirection;
  lastTickTime = performance.now();

  if (direction.x === 0 && direction.y === 0) {
    previousSnake = snake.map(s => ({x: s.x, y: s.y}));
    return;
  }

  previousSnake = snake.map(s => ({x: s.x, y: s.y}));

  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    return endGame();
  }

  if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
    return endGame();
  }

  snake.unshift(head);

  if (head.x === apple.x && head.y === apple.y) {
    score++;
    if (score > highScore) {
      highScore = score;
      document.getElementById('highScore').textContent = highScore;
    }
    document.getElementById('score').textContent = score;

    if (snake.length >= tileCount * tileCount) {
      return winGame();
    }
    placeApple();
  } else {
    snake.pop();
  }
}

function draw() {
  const now = performance.now();
  let t = (now - lastTickTime) / tickInterval;
  if (t > 1) t = 1;
  if (t < 0) t = 0;

  drawBackground();
  drawApple();
  drawSnake(t);

  if (!gameOver) {
    requestAnimationFrame(draw);
  }
}

function endGame() {
  gameOver = true;
  clearInterval(gameLoop);
  document.getElementById('overlayBox').classList.remove('win');
  document.getElementById('overlayText').textContent = 'Game Over! Point: ' + score;
  document.getElementById('overlay').style.display = 'flex';
}

function winGame() {
  gameOver = true;
  clearInterval(gameLoop);
  document.getElementById('overlayBox').classList.add('win');
  document.getElementById('overlayText').textContent = 'DU VINDER!';
  document.getElementById('overlay').style.display = 'flex';
}

function restartGame() {
  initGame();
  requestAnimationFrame(draw);
}

// --- Settings ---
function openSettings() {
  document.getElementById('overlay').style.display = 'none';
  document.querySelectorAll('.sizeBtn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.size === currentSizeKey);
  });
  document.getElementById('settingsOverlay').style.display = 'flex';
}

function closeSettings() {
  document.getElementById('settingsOverlay').style.display = 'none';
  document.getElementById('overlay').style.display = 'flex';
}

function chooseSize(key) {
  currentSizeKey = key;
  document.getElementById('settingsOverlay').style.display = 'none';
  restartGame();
}

// --- Tastatur-styring ---
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();

  if (key === ' ' || e.code === 'Space') {
    if (gameOver) {
      e.preventDefault();
      restartGame();
    }
    return;
  }

  if (key === 'w' && direction.y === 0) nextDirection = {x: 0, y: -1};
  else if (key === 's' && direction.y === 0) nextDirection = {x: 0, y: 1};
  else if (key === 'a' && direction.x === 0) nextDirection = {x: -1, y: 0};
  else if (key === 'd' && direction.x === 0) nextDirection = {x: 1, y: 0};
});

// --- Swipe-styring til telefon/tablet ---
let touchStartX = 0;
let touchStartY = 0;
const swipeThreshold = 20;

canvas.addEventListener('touchstart', (e) => {
  const touch = e.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
}, { passive: true });

canvas.addEventListener('touchend', (e) => {
  const touch = e.changedTouches[0];
  const deltaX = touch.clientX - touchStartX;
  const deltaY = touch.clientY - touchStartY;

  if (Math.abs(deltaX) < swipeThreshold && Math.abs(deltaY) < swipeThreshold) {
    return;
  }

  if (Math.abs(deltaX) > Math.abs(deltaY)) {
    if (deltaX > 0 && direction.x === 0) nextDirection = {x: 1, y: 0};
    else if (deltaX < 0 && direction.x === 0) nextDirection = {x: -1, y: 0};
  } else {
    if (deltaY > 0 && direction.y === 0) nextDirection = {x: 0, y: 1};
    else if (deltaY < 0 && direction.y === 0) nextDirection = {x: 0, y: -1};
  }
}, { passive: true });

initGame();
requestAnimationFrame(draw);
</script>

</body>
</html>
