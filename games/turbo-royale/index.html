<style>

<div class="scr" id="lobby"><div class="logo">TURBO ROYALE<small style="font-size:12px;font-style:normal;margin-left:10px;opacity:.75">v6 · drift · kamera · easy/medium/hard</small></div>

<script>
const $=i=>document.getElementById(i),T=THREE,LAPS=3,S=700;
const REW={Easy:[1000,750,500],Medium:[2000,1750,1500],Hard:[3000,2750,2500]},DIF={Easy:.97,Medium:1,Hard:1.03},BF={Easy:.5,Medium:.65,Hard:.8};
let diff='Easy';

const MAPS=[
{n:'Grøn Græsplæne',sky:0x8fd3ff,g:0x4caf50,r:0x333333,R:200,w:[[.25,2,0],[.15,3,1]],el:2,d:[0,0x2e7d32,140]},
{n:'Snebjerg',sky:0xcfe8ff,g:0xf5faff,r:0x555b66,R:230,w:[[.2,2,1],[.1,5,0]],el:45,d:[0,0x1b5e20,120]},
{n:'Ørkenen',sky:0xffe0a3,g:0xe0b060,r:0x4a4034,R:210,w:[[.3,2,2],[.1,4,0]],el:4,d:[3,0x2e7d32,90]},
{n:'Neon By',sky:0x0a0a2a,g:0x15152e,r:0x222233,R:190,w:[[.2,3,0],[.15,2,2]],el:3,d:[1,0xff2bd6,140]},
{n:'Vulkan',sky:0x4a1c14,g:0x2b1a17,r:0x5a2f24,R:220,w:[[.2,2,3],[.15,4,1]],el:28,d:[2,0xff5722,110]},
{n:'Stranden',sky:0x7fdcff,g:0xf3e2a9,r:0x6d6d6d,R:260,w:[[.12,2,0],[.1,3,2]],el:1,d:[0,0x00a86b,80]},
{n:'Skoven',sky:0x6a8f6a,g:0x2e5d2e,r:0x4e4035,R:200,w:[[.3,2,4],[.2,3,0]],el:12,d:[0,0x1b4d1b,220]},
{n:'Isøen',sky:0xb3ecff,g:0xa8e6ff,r:0x3b6a8a,R:230,w:[[.2,3,1],[.1,2,0]],el:6,d:[2,0xffffff,100]},

{n:'Slikland',sky:0xffc4e8,g:0xff9ad5,r:0x7e57c2,R:200,w:[[.25,3,3],[.15,2,1]],el:5,d:[2,0xffeb3b,130]},
{n:'Under Vandet',sky:0x0a4a7a,g:0xc8b27a,r:0x2c4a5a,R:220,w:[[.2,3,2],[.12,2,0]],el:6,d:[4,0xff6f91,150],u:1},
{n:'Junglen',sky:0x7fb77e,g:0x2d6a2d,r:0x3b3328,R:215,w:[[.28,2,5],[.14,4,2]],el:10,d:[0,0x0b5d1e,260]},
{n:'Canyon',sky:0xf2b68c,g:0xc0643c,r:0x3d2b24,R:225,w:[[.22,2,1],[.14,3,4]],el:20,d:[1,0xa0522d,150]},
{n:'Efteråret',sky:0xffd9a0,g:0x8d6e3b,r:0x403a30,R:205,w:[[.25,3,1],[.12,2,3]],el:6,d:[0,0xe67e22,200]},
{n:'Polarnatten',sky:0x0b1d3a,g:0xdff3ff,r:0x30405a,R:215,w:[[.2,2,4],[.14,5,1]],el:14,d:[0,0x7fd6ff,130]}];
const NAMES=['Mads','Freja','NoScope','Viking99','Luna','Oscar','ProDriver','Emil','Sofie'];
let D={m:0,o:[0],s:0};try{D=Object.assign(D,JSON.parse(localStorage.getItem('tr1')))}catch(e){}
const save=()=>{try{localStorage.setItem('tr1',JSON.stringify(D))}catch(e){}};
const hex=c=>'#'+c.toString(16).padStart(6,'0');

const R=new T.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new T.Scene(),cam=new T.PerspectiveCamera(65,1,.1,1500);
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const clear=()=>{while(scene.children.length)scene.remove(scene.children[0])};
const lights=()=>{scene.add(new T.AmbientLight(0xffffff,.75));const d=new T.DirectionalLight(0xffffff,.7);d.position.set(50,100,30);scene.add(d)};
const M=(g,c,e)=>new T.Mesh(g,new T.MeshLambertMaterial({color:c,emissive:e||0}));
function carMesh(c){const g=new T.Group(),b=M(new T.BoxGeometry(2,.7,4.2),c);b.position.y=.6;g.add(b);
const k=M(new T.BoxGeometry(1.6,.6,1.8),0x222233);k.position.set(0,1.15,-.3);g.add(k);
const sp=M(new T.BoxGeometry(2.1,.12,.5),c);sp.position.set(0,1.3,-1.9);g.add(sp);
for(const x of[-1.05,1.05])for(const z of[-1.3,1.4]){const w=M(new T.CylinderGeometry(.45,.45,.4,14),0x111111);w.rotation.z=1.5708;w.position.set(x,.45,z);g.add(w);const rm=M(new T.CylinderGeometry(.27,.27,.44,8),0xd0d0d0);rm.rotation.z=1.5708;rm.position.set(x,.45,z);g.add(rm)}
for(const x of[-.7,.7]){const h=M(new T.BoxGeometry(.5,.25,.1),0xffffcc,0xffffaa);h.position.set(x,.65,2.12);g.add(h);const t=M(new T.BoxGeometry(.5,.2,.1),0xff0000,0xaa0000);t.position.set(x,.7,-2.12);g.add(t)}
const st=M(new T.BoxGeometry(.4,.02,4.2),0xffffff);st.position.y=.96;g.add(st);for(const x of[-1.12,1.12]){const mr=M(new T.BoxGeometry(.25,.2,.35),0x222222);mr.position.set(x,.95,.7);g.add(mr)}
const fb=M(new T.BoxGeometry(2.1,.18,.5),0x111111);fb.position.set(0,.33,2.2);g.add(fb);const rd=M(new T.BoxGeometry(2,.18,.4),0x111111);rd.position.set(0,.33,-2.2);g.add(rd);
for(const x of[-1.02,1.02]){const sk=M(new T.BoxGeometry(.12,.2,2.6),0x111111);sk.position.set(x,.38,0);g.add(sk)}
const ws=M(new T.BoxGeometry(1.5,.5,.08),0x88ccff,0x113355);ws.position.set(0,1.15,.62);ws.rotation.x=-.45;g.add(ws);
for(const x of[-.5,.5]){const ex=M(new T.CylinderGeometry(.12,.12,.4,8),0x999999);ex.rotation.x=1.5708;ex.position.set(x,.4,-2.25);g.add(ex)}
const sd=new T.Mesh(new T.PlaneGeometry(2.6,4.8),new T.MeshBasicMaterial({color:0,transparent:true,opacity:.35}));sd.rotation.x=-1.5708;sd.position.y=.04;g.add(sd);
const fl=new T.Group();for(const x of[-.6,.6]){const f=M(new T.ConeGeometry(.35,2,8),0xff9100,0xff6d00);f.rotation.x=-1.5708;f.position.set(x,.6,-3.1);fl.add(f)}fl.visible=false;g.add(fl);g.fl=fl;
g.rotation.order='YXZ';return g}

// ---------- LOBBY ----------
let st='lobby',view=D.s,show,lt=0;
function lobby(){st='lobby';clear();scene.background=new T.Color(0x2a1470);scene.fog=null;lights();
const pl=M(new T.CylinderGeometry(6,6.5,.6,48),0x3b1fa8);pl.position.y=-.3;scene.add(pl);
const ring=M(new T.TorusGeometry(6.3,.12,8,64),0xffe600,0xffe600);ring.rotation.x=1.5708;scene.add(ring);
const pts=[];for(let i=0;i<400;i++)pts.push((Math.random()-.5)*160,Math.random()*60,(Math.random()-.5)*160);
const sg=new T.BufferGeometry();sg.setAttribute('position',new T.Float32BufferAttribute(pts,3));scene.add(new T.Points(sg,new T.PointsMaterial({color:0xffffff,size:.6})));
view=D.s;setShow(view);ui('lobby');$('t1').click();info()}
function setShow(i){if(show)scene.remove(show);show=carMesh(CARS[i].c);scene.add(show)}
function ui(id){['lobby','maps','hud','res'].forEach(x=>$(x).classList.toggle('hide',x!=id))}
function info(){const c=CARS[D.s];$('info').innerHTML=`<b>${c.n}</b>Topfart ${Math.round(c.v*3.6)} km/t · Acceleration ${c.a} · Styring ${c.h.toFixed(1)} · Boost ${c.b.toFixed(1)}s<br>SHIFT = boost · MELLEMRUM = drift (bedre biler drifter bedre)`;$('mny').textContent='🪙 '+D.m;garage()}
function garage(){$('garage').innerHTML=CARS.map((c,i)=>{const o=D.o.includes(i);return `<div class="cc ${i==view?'sel':''}" onclick="view=${i};setShow(${i});garage()"><div><b>${c.n}</b><small>${'■'.repeat(Math.round((c.v-42)/4))}</small><small style="display:block;color:#7fe;letter-spacing:0;font-size:12px">Styring ${c.h.toFixed(1)} · Boost ${c.b.toFixed(1)}s</small></div><button ${!o&&D.m<c.p?'disabled':''} onclick="event.stopPropagation();act(${i})">${o?(D.s==i?'VALGT':'VÆLG'):'KØB 🪙'+c.p}</button></div>`}).join('')}
function act(i){if(!D.o.includes(i)){if(D.m<CARS[i].p)return;D.m-=CARS[i].p;D.o.push(i)}D.s=i;save();info()}
$('t1').onclick=()=>{$('t1').classList.add('on');$('t2').classList.remove('on');$('garage').classList.add('hide');$('play').classList.remove('hide');view=D.s;setShow(view)};
$('t2').onclick=()=>{$('t2').classList.add('on');$('t1').classList.remove('on');$('garage').classList.remove('hide');$('play').classList.add('hide');garage()};
$('play').onclick=()=>{ui('maps');drawMaps()};$('back').onclick=()=>ui('lobby');$('rb').onclick=lobby;$('rsm').onclick=()=>{pz=0;$('pz').classList.add('hide')};$('rst').onclick=()=>race(cm);$('qt').onclick=()=>{pz=0;$('pz').classList.add('hide');lobby()};
function drawMaps(){$('dif').innerHTML='';
$('rew').textContent='Præmie (1./2./3. plads) — '+Object.keys(REW).map(d=>d+' 🪙'+REW[d].join('/')).join('  ·  ');
$('grid').innerHTML=MAPS.map((m,i)=>`<div class="mc" style="background:linear-gradient(${hex(m.sky)},${hex(m.g)})" ><b>${m.n}</b><div class="db">${['Easy','Medium','Hard'].map((d,j)=>`<button class="e${j}" onclick="diff='${d}';race(${i})">${d.toUpperCase()}</button>`).join('')}</div></div>`).join('')}

// ---------- RACE ----------
let P,NR,TG,CV,L,cars,pl,cd,nf,mmBase,mb,keys={},SM=[],smi=0,cm=0,pz=0,FS=[];
addEventListener('keydown',e=>{if(e.code=='Escape'&&(st=='count'||st=='go')&&$('res').classList.contains('hide')){pz=!pz;$('pz').classList.toggle('hide',!pz);keys={}}keys[e.code]=1;if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=0);
function ribbon(o,w,c,y){const v=[],ix=[];for(let i=0;i<S;i++){const p=P[i],n=NR[i];for(const s of[-1,1])v.push(p.x+n.x*(o+s*w/2),p.y+y,p.z+n.z*(o+s*w/2));const a=i*2,b=((i+1)%S)*2;ix.push(a,b,a+1,a+1,b,b+1)}
const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(v,3));g.setIndex(ix);g.computeVertexNormals();
const me=new T.Mesh(g,new T.MeshLambertMaterial({color:c,side:T.DoubleSide}));scene.add(me)}
function race(mi){cm=mi;pz=0;$('pz').classList.add('hide');const m=MAPS[mi];clear();scene.background=new T.Color(m.sky);scene.fog=new T.Fog(m.sky,m.u?10:250,m.u?260:1300);lights();
const K=72,pts=[],t1=1+mi*1.9,t2=t1+2.2,t3=t1+4.3;for(let i=0;i<K;i++){const t=i/K*6.2832;let r=1;m.w.forEach(([a,f,p])=>r+=a*Math.sin(f*t+p));r+=.1*Math.sin(7*t)*(Math.max(0,Math.cos(t-t1))**3+Math.max(0,Math.cos(t-t2))**3+Math.max(0,Math.cos(t-t3))**3);r*=m.R;pts.push(new T.Vector3(r*Math.cos(t),m.el*(.5-.5*Math.cos(t)),r*Math.sin(t)))}
CV=new T.CatmullRomCurve3(pts,true);P=CV.getSpacedPoints(S).slice(0,S);L=CV.getLength();
TG=P.map((p,i)=>{const a=P[(i+1)%S],b=P[(i+S-1)%S];return new T.Vector3(a.x-b.x,0,a.z-b.z).normalize()});NR=TG.map(t=>new T.Vector3(-t.z,0,t.x));
const gp=M(new T.PlaneGeometry(4000,4000),m.g);gp.rotation.x=-1.5708;gp.position.y=-1;scene.add(gp);
ribbon(0,170,m.g,-.15);ribbon(0,38,m.r,0);ribbon(-18.5,1.1,0xffffff,.05);ribbon(18.5,1.1,0xffffff,.05);
const sl=M(new T.BoxGeometry(38,.1,1.6),0xffffff);sl.position.copy(P[0]).setY(P[0].y+.08);sl.rotation.y=Math.atan2(TG[0].x,TG[0].z)+1.5708*0;scene.add(sl);
const [sh,dc,cnt]=m.d,gm=[new T.ConeGeometry(3,9,8),new T.BoxGeometry(10,1,10),new T.IcosahedronGeometry(3,0),new T.CylinderGeometry(.8,.8,8,8),new T.TorusKnotGeometry(1.6,.45,40,6)];
for(let i=0;i<cnt;i++){const k=Math.floor(Math.random()*S),o=(Math.random()<.5?-1:1)*(32+Math.random()*40),s=.7+Math.random()*.8;let d=M(gm[sh],sh==4?new T.Color().setHSL(Math.random(),.7,.6):dc,sh==1?dc:0);
if(sh==1)d.scale.y=8+Math.random()*30;else d.scale.setScalar(s);d.position.set(P[k].x+NR[k].x*o,P[k].y+(sh==1?d.scale.y/2:(sh==0?4.5*s:1.5)),P[k].z+NR[k].z*o);scene.add(d)
if(sh==0){const tr=M(new T.CylinderGeometry(.6,.6,3,6),0x5d4037);tr.position.set(d.position.x,P[k].y+1.2,d.position.z);scene.add(tr)}}
extras(m);extras2(m);extras3(m);extras4(m);
// minimap
let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;P.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);z0=Math.min(z0,p.z);z1=Math.max(z1,p.z)});
mb={x0,z0,s:136/Math.max(x1-x0,z1-z0)};mmBase=document.createElement('canvas');mmBase.width=mmBase.height=160;const q=mmBase.getContext('2d');q.strokeStyle='#fff';q.lineWidth=7;q.lineJoin='round';q.beginPath();
P.forEach((p,i)=>{const[a,b]=mp(p.x,p.z);i?q.lineTo(a,b):q.moveTo(a,b)});q.closePath();q.stroke();
// cars

const mp=(x,z)=>[12+(x-mb.x0)*mb.s,12+(z-mb.z0)*mb.s];

function step(dt){const car=CARS[D.s];
if(st=='count'){cd-=dt;$('count').textContent=cd>3?'':cd>0?Math.ceil(cd):'KØR!';if(cd<-.8){st='go';$('count').textContent=''}}
const go=st!='count';
// player
if(go){const up=keys.ArrowUp||keys.KeyW,dn=keys.ArrowDown||keys.KeyS,lf=(keys.ArrowLeft||keys.KeyA)?1:0,rt=(keys.ArrowRight||keys.KeyD)?1:0;
const bs=!pl.fin&&(keys.ShiftLeft||keys.ShiftRight)&&pl.bo>0;pl.bst=bs;pl.bo=bs?pl.bo-dt:Math.min(car.b,pl.bo+dt*.4);
if(pl.fin){pl.sp*=1-dt*.8}else if(up||bs)pl.sp+=car.a*(bs?2.4:1)*dt;else if(dn)pl.sp-=car.a*1.8*dt;else pl.sp-=pl.sp*.5*dt;

pl.x+=Math.sin(pl.mv)*pl.sp*dt;pl.z+=Math.cos(pl.mv)*pl.sp*dt}
let b=1e9,bi=pl.i;for(let j=-25;j<=25;j++){const k=(pl.i+j+S)%S,dx=pl.x-P[k].x,dz=pl.z-P[k].z,d=dx*dx+dz*dz;if(d<b){b=d;bi=k}}
if(bi-pl.i<-S/2)pl.lap++;else if(bi-pl.i>S/2)pl.lap--;pl.i=bi;

c.x=P[i0].x+(P[i1].x-P[i0].x)*t+nn.x*c.lane;c.z=P[i0].z+(P[i1].z-P[i0].z)*t+nn.z*c.lane;c.y=P[i0].y;c.a=Math.atan2(TG[i0].x,TG[i0].z);c.i=i0});
cars.forEach(c=>{if(!c.fin&&c.p>=LAPS){c.fin=++nf;if(c===pl)finish()}
const k=(c.i+3)%S,sl=(P[k].y-P[c.i].y)/5.7,dir=Math.sin(c.a)*TG[c.i].x+Math.cos(c.a)*TG[c.i].z;
c.mesh.position.set(c.x,c.y+.15,c.z);c.mesh.fl.visible=!!c.bst;c.mesh.rotation.y=c.a;c.mesh.rotation.x=-Math.atan(sl)*(dir>=0?1:-1)});
