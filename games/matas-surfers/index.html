<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matas Surfers</title>
<style>
:root{--c:#5d73b8;--d:#3f5190;--card:#fff;--ink:#26305a;--f:"Arial Black","Helvetica Neue",Arial,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1c2140;--ink:#eef0ff;color-scheme:dark}}
:root[data-theme="dark"]{--card:#1c2140;--ink:#eef0ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#fde8f0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:Arial,Helvetica,sans-serif}
#w{position:relative;height:100%}
canvas{display:block}
#hud{position:absolute;inset:12px 12px auto;display:none;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;pointer-events:none}
.pill{background:var(--c);color:#fff;border-radius:18px;padding:8px 16px;display:flex;align-items:baseline;gap:8px;box-shadow:0 3px 0 var(--d);font:900 15px var(--f)}
.pill b{font:900 38px/1 var(--f);font-variant-numeric:tabular-nums}
.info{display:flex;flex-direction:column;align-items:flex-end;gap:4px;color:var(--d);font:900 15px/1.2 var(--f);text-align:right;text-shadow:0 1px 0 #fff}
#bar{grid-column:1/-1;height:10px;background:#fff;border-radius:6px;overflow:hidden;border:2px solid var(--c)}
#bi{display:block;height:100%;width:0;background:var(--c)}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(253,232,240,.6)}
#ov[hidden]{display:none}
.card{background:var(--card);color:var(--ink);border-radius:24px;padding:28px 26px;max-width:380px;text-align:center;box-shadow:0 6px 0 #f1a8c2}
h1{margin:0 0 12px;font:900 34px/1 var(--f);color:var(--c)}
.card p{margin:0 0 12px;font-size:16px;line-height:1.45}
.how{font-size:14px!important;opacity:.8}
button{background:var(--c);color:#fff;border:0;border-radius:16px;padding:14px 28px;font:900 18px var(--f);cursor:pointer;box-shadow:0 4px 0 var(--d)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--d)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<div id="w">
 <div id="hud">
  <div class="pill"><b id="p">0</b>point</div>
  <div class="info"><span id="d"></span><span id="c"></span></div>
  <div id="bar"><i id="bi"></i></div>
 </div>
 <div id="ov"><div class="card">
  <h1 id="t">Matas Surfers</h1>
  <p id="msg">Hop over soft mud wax, smut under bordet og undvig den kæmpe håndcreme. Du får 1 point for hver 1.000 meter og 1 Matas-mønt hvert 30. sekund.</p>
  <p class="how">Piletaster: ← → skifter bane, ↑ hopper, ↓ ruller. På mobil: swipe.</p>
  <button id="go">Start løbet</button>
 </div></div>
</div>

 const add=(geo,mat,x,y,z)=>{const m=new T.Mesh(geo,mat);m.position.set(x,y,z);g.add(m)};
 add(GT.top,M.w,0,1.07,0);
 for(const sx of[-1,1])for(const sz of[-1,1])add(GT.leg,M.p,sx,.5,sz*.5);
 for(const[k,x,z,c]of[[0,-.85,.2,'b'],[1,-.45,-.25,'p'],[2,-.1,.2,'l'],[0,.3,-.2,'p'],[1,.65,.25,'m'],[2,.9,-.2,'b'],[0,.05,-.35,'m']]){
  add(IG[k][0],M[c],x,1.14+IY[k][0],z);add(IG[k][1],M.w,x,1.14+IY[k][1],z)}
 return g}
const TY={
 tall:{b:0,t:3.2,hw:.7,hd:.3,mk:()=>stand(GP.tube,tubeM,3.2,.45)},
 low:{b:0,t:1,hw:.75,hd:.5,mk:()=>stand(GP.jar,jarM,1.18,.8)},
 bar:{b:1,t:1.8,hw:1.1,hd:.6,mk:table}};
function addObs(l,k,z){const m=TY[k].mk();m.position.set(LX[l],0,z);S.add(m);obs.push({m,d:TY[k],k})}
function row(z=-125){const L=[0,1,2].sort(()=>Math.random()-.5),n=Math.random()<.5?1:2,K=['low','bar'];
 for(let i=0;i<n;i++)addObs(L[i],Math.random()<.35?'tall':K[Math.random()*2|0],z)}

/* spillogik */
let st='menu',speed=14,dist=0,coins=0,tm=0,fx=0,px=0,tl=1,py=0,vy=0,sl=0,spawn=0,last=0,ph=0;
const MSG={tall:'Du løb ind i en kæmpe håndcreme.',low:'Du ramte soft mud wax-krukken.',bar:'Du ramte bordet.'};
function start(){for(const o of obs)S.remove(o.m);obs.length=0;
 speed=14;dist=coins=tm=fx=0;tl=1;py=vy=sl=0;row(-55);spawn=0;st='play';$('ov').hidden=true;$('hud').style.display='grid'}
function die(k){st='over';const f=n=>n.toLocaleString('da-DK');$('t').textContent='Løbet sluttede';
 $('msg').textContent=MSG[k]+' Du fik '+Math.floor(dist/1000)+' point ('+f(Math.floor(dist))+' m) og '+coins+' Matas-'+(coins==1?'mønt':'mønter')+'.';$('go').textContent='Løb igen';$('ov').hidden=false}
function loop(ts){
 requestAnimationFrame(loop);
 const dt=Math.min((ts-last)/1000||0,.05);last=ts;
 const v=st==='play'?speed:st==='menu'?9:0,dz=v*dt;
 gt.offset.y+=dz/8;
 for(const m of SH){m.position.z+=dz;if(m.position.z>13)m.position.z-=140}
 if(st==='play'){
  speed=Math.min(32,speed+dt*.2);dist+=dz;spawn-=dz;
  if(spawn<=0){row();spawn=18+Math.random()*8+speed*.5}
  const hh=sl>0?.9:1.8;
  for(let i=obs.length-1;i>=0;i--){const o=obs[i],p=o.m.position;p.z+=dz;
   if(p.z>10){S.remove(o.m);obs.splice(i,1)}
   else if(Math.abs(p.z)<o.d.hd+.3&&Math.abs(p.x-px)<o.d.hw+.3&&py<o.d.t&&py+hh>o.d.b){die(o.k);break}}
  if(sl>0)sl-=dt;
  tm+=dt;if(Math.floor(tm/30)>coins){coins++;fx=2}if(fx>0)fx-=dt;
  $('p').textContent=Math.floor(dist/1000);$('d').textContent=Math.floor(dist%1000)+' / 1.000 m';
  $('c').textContent=fx>0?'+1 Matas-mønt!':coins+(coins==1?' mønt':' mønter')+', næste om '+Math.ceil(30-tm%30)+' s';
  $('bi').style.width=(dist%1000)/10+'%';
 }
 if(st!=='over'){
  px+=(LX[tl]-px)*Math.min(1,dt*14);
  if(py>0||vy>0){vy-=30*dt;py+=vy*dt;if(py<=0){py=0;vy=0}}
  ph+=dt*(8+v*.3);
 }
 const a=Math.sin(ph)*.9,air=py>0;
 legL.rotation.x=air?.7:a;legR.rotation.x=air?-.5:-a;armL.rotation.x=air?-2.4:-a;armR.rotation.x=air?-2.4:a;
 body.scale.y=sl>0?.55:1;
 P.position.set(px,py,0);P.rotation.z=(px-LX[tl])*.1;
 sh.position.x=px;sh.scale.setScalar(Math.max(.4,1-py*.3));
 cam.position.set(px*.5,4.4,7.6);cam.lookAt(px*.3,1.5,-8);
 R.render(S,cam);
}
requestAnimationFrame(loop);

/* styring */
const mv=d=>{if(st==='play')tl=Math.max(0,Math.min(2,tl+d))};
const jump=()=>{if(st==='play'&&py<=0){vy=10;sl=0}};
const slide=()=>{if(st!=='play')return;if(py>0)vy=-20;sl=.7};
addEventListener('keydown',e=>{const k=e.key;let h=true;
 if(k==='ArrowLeft'||k==='a'||k==='A')mv(-1);
 else if(k==='ArrowRight'||k==='d'||k==='D')mv(1);
 else if(k==='ArrowUp'||k==='w'||k==='W')jump();
 else if(k==='ArrowDown'||k==='s'||k==='S')slide();
 else if(k===' '||k==='Enter'){if(st!=='play'){if(!e.repeat)start()}else jump()}
 else h=false;
 if(h)e.preventDefault()});
let sx=0,sy=0;
addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;
 if(Math.max(Math.abs(dx),Math.abs(dy))<24){jump();return}
 if(Math.abs(dx)>Math.abs(dy))mv(dx>0?1:-1);else if(dy<0)jump();else slide()});
$('go').onclick=start;
</script>
<script src="/stats.js" data-game="matas-surfers" defer></script>
</body>
