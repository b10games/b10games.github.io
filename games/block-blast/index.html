<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Block Blast</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    background: #0b6fa3;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 {
    margin: 16px 0 4px 0;
    letter-spacing: 1px;
  }
  #scoreBar {
    display: flex;
    gap: 30px;
    margin-bottom: 14px;
    font-size: 16px;
  }
  #scoreBar .label {
    color: #cfe9fb;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #scoreBar .value {
    font-size: 22px;
    font-weight: bold;
  }
  #boardWrapper {
    position: relative;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: min(88vw, 400px);
    height: min(88vw, 400px);
    background: #2a3040;
    border: 4px solid #3a4256;
    border-radius: 8px;
    overflow: hidden;
  }
  .cell {
    background: #333c4e;
    box-shadow: inset 0 0 0 1px #2a3040;
    border-radius: 3px;
    transition: background-color 0.08s ease;
    transform-origin: center;
  }
  .cell.filled {
    border-radius: 2px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.35);
    border: 2px solid rgba(0,0,0,0.65);
    box-sizing: border-box;
  }
  .cell.preview-valid {
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.9);
    filter: brightness(1.25);
  }
  .cell.preview-invalid {
    background: #6b2c2c !important;
  }
  .cell.line-preview {
    box-shadow: inset 0 0 0 3px #ffffff, 0 0 10px 2px rgba(255,255,255,0.85);
    filter: brightness(1.4);
    z-index: 2;
  }
  .cell.clearing {
    animation: clearPop 0.24s cubic-bezier(0.33, 1, 0.68, 1) forwards;
    z-index: 5;
  }
  @keyframes clearPop {
    0% { transform: scale(1); filter: brightness(1.3); opacity: 1; }
    45% { transform: scale(1.12); filter: brightness(2.1); opacity: 1; }
    100% { transform: scale(0); filter: brightness(2.6); opacity: 0; }
  }
  #tray {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 22px;
    min-height: 90px;
  }
  .tray-box {
    width: 92px;
    height: 92px;
    background: #14294d;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: grab;
  }
  .tray-box.used {
    visibility: hidden;
  }
  .piece-slot {
    display: grid;
    gap: 2px;
  }
  .piece-cell {
    width: 20px;
    height: 20px;
    border-radius: 2px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25);
    box-sizing: border-box;
  }
  .piece-cell:not(.empty) {
    border: 2px solid rgba(0,0,0,0.65);
  }
  .piece-cell.empty {
    background: transparent;
    box-shadow: none;
  }
  #dragClone {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    display: grid;
    gap: 2px;
    z-index: 999;
    opacity: 0.9;
    display: none;
  }
  #dragClone .piece-cell {
    width: var(--cell-size, 40px);
    height: var(--cell-size, 40px);
    border-width: 3px;
  }
  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    z-index: 1000;
  }
  #overlayBox {
    background: #232838;
    border: 2px solid #3a4256;
    border-radius: 12px;
    padding: 30px 40px;
    text-align: center;
  }
  #overlayBox h2 {
    margin: 0 0 8px 0;
  }
  #overlayBox p {
    margin: 4px 0;
    color: #cdd4e0;
  }
  button {
    margin-top: 14px;
    padding: 10px 22px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    background: #2f80ed;
    color: white;
  }
  button:hover {
    background: #4a90f5;
  }
  #restartBtn {
    position: fixed;
    left: 16px;
    bottom: 16px;
    margin-top: 0;
    background: #14294d;
    border: 2px solid rgba(255,255,255,0.25);
    z-index: 500;
  }
  #restartBtn:hover {
    background: #1c3f66;
  }
</style>
</head>
<body>

<h1>🧩 Block Blast</h1>
<div id="scoreBar">
  <div>
    <div class="label">Point</div>
    <div class="value" id="score">0</div>
  </div>
  <div>
    <div class="label">Highscore</div>
    <div class="value" id="highScore">0</div>
  </div>
</div>

<div id="boardWrapper">
  <div id="board"></div>
  <div id="overlay">
    <div id="overlayBox">
      <h2 id="overlayTitle">Game Over</h2>
      <p id="overlayScore">Point: 0</p>
      <button onclick="startGame()">Spil igen</button>
    </div>
  </div>
</div>

<button id="restartBtn" onclick="startGame()" title="Start forfra">↻ Restart</button>

<div id="tray"></div>
<div id="dragClone"></div>

<script>
const GRID_SIZE = 8;
const COLORS = ['#f6a623', '#2f80ed', '#27ae60', '#9b59b6', '#e74c3c', '#f1c40f', '#16a085', '#e84393'];

// Alle mulige blok-former, defineret som [dx, dy] koordinater
const SHAPES = [
  // 1x1 er bevidst IKKE med — den ville altid kunne redde dig fra at tabe,
  // hvilket gør spillet for nemt.
  [[0,0],[1,0]],                                        // 1x2 vandret
  [[0,0],[1,0],[2,0]],                                  // 1x3 vandret
  [[0,0],[0,1],[0,2]],                                  // 1x3 lodret
  [[0,0],[1,0],[2,0],[3,0]],                            // 1x4 vandret
  [[0,0],[0,1],[0,2],[0,3]],                            // 1x4 lodret
  [[0,0],[1,0],[0,1],[1,1]],                            // 2x2 firkant
  [[0,0],[1,0],[2,0],[0,1]],                            // L (vandret bjælke med ben ned fra venstre)
  [[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]],                // 3x2 blok
  [[0,0],[1,0],[0,1],[1,1],[0,2],[1,2]],                // 2x3 blok
  [[0,0],[0,1],[0,2],[1,2]],                            // L
  [[1,0],[1,1],[1,2],[0,2]],                            // J
  [[0,0],[1,0],[2,0],[1,1]],                            // T (vandret)
  [[0,0],[0,1],[1,1],[0,2]],                            // T (lodret)
  [[1,0],[2,0],[0,1],[1,1]],                            // S
  [[0,0],[1,0],[1,1],[2,1]],                            // Z
  [[0,0],[0,1],[1,1]],                                  // lille hjørne
  [[0,0],[1,0],[2,0],[0,1],[0,2]],                       // stort hjørne
  [[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]], // 3x3 firkant (9 felter)
];

let board = [];        // GRID_SIZE x GRID_SIZE array af farve-strenge eller null
let tray = [];         // array af { shape, color, used }
let score = 0;
let highScore = 0;
let dragging = null;   // { trayIndex, shape, color, w, h }
let lastAnchor = null;

const boardEl = document.getElementById('board');
const trayEl = document.getElementById('tray');
const dragCloneEl = document.getElementById('dragClone');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const overlayEl = document.getElementById('overlay');

let cellEls = [];

function buildBoardDOM() {
  boardEl.innerHTML = '';
  cellEls = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    const row = [];
    for (let c = 0; c < GRID_SIZE; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      boardEl.appendChild(cell);
      row.push(cell);
    }
    cellEls.push(row);
  }
}

function startGame() {
  board = Array.from({length: GRID_SIZE}, () => Array(GRID_SIZE).fill(null));
  score = 0;
  updateScore();
  overlayEl.style.display = 'none';
  buildBoardDOM();
  renderBoard();
  generateTray();
}

function updateScore() {
  scoreEl.textContent = score;
  if (score > highScore) {
    highScore = score;
    highScoreEl.textContent = highScore;
  }
}

function renderBoard() {
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const el = cellEls[r][c];
      const val = board[r][c];
      if (val) {
        el.classList.add('filled');
        el.style.background = val;
      } else {
        el.classList.remove('filled');
        el.style.background = '';
      }
    }
  }
}

function shapeBounds(shape) {
  const w = Math.max(...shape.map(p => p[0])) + 1;
  const h = Math.max(...shape.map(p => p[1])) + 1;
  return {w, h};
}

function randomShape() {
  const shape = pickAdaptiveShape();
  const color = COLORS[Math.floor(Math.random() * COLORS.length)];
  const {w, h} = shapeBounds(shape);
  return {shape, color, w, h, used: false};
}

// Finder alle sammenhængende tomme områder på feltet (4-vejs)
function getEmptyRegions() {
  const visited = Array.from({length: GRID_SIZE}, () => Array(GRID_SIZE).fill(false));
  const regions = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (!board[r][c] && !visited[r][c]) {
        const stack = [{r, c}];
        visited[r][c] = true;
        const region = [];
        while (stack.length) {
          const cur = stack.pop();
          region.push(cur);
          const neighbors = [[cur.r - 1, cur.c], [cur.r + 1, cur.c], [cur.r, cur.c - 1], [cur.r, cur.c + 1]];
          for (const [nr, nc] of neighbors) {
            if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && !board[nr][nc] && !visited[nr][nc]) {
              visited[nr][nc] = true;
              stack.push({r: nr, c: nc});
            }
          }
        }
        regions.push(region);
      }
    }
  }
  return regions;
}

function cellsMatchRegion(cells, region) {
  if (cells.length !== region.length) return false;
  const setA = new Set(cells.map(p => p.r + ',' + p.c));
  const setB = new Set(region.map(p => p.r + ',' + p.c));
  for (const key of setA) if (!setB.has(key)) return false;
  return true;
}

// Alle gyldige placeringer af en form på det nuværende felt
function allValidPlacements(shape) {
  const results = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const cells = shape.map(([dx, dy]) => ({r: r + dy, c: c + dx}));
      if (isValidPlacementForBoard(cells)) results.push(cells);
    }
  }
  return results;
}

// Vælger en form der passer godt til det nuværende felt.
// Former der udfylder et tomt "rum" helt perfekt (fx en 3x3 firkant der
// lige netop passer i et tomt 3x3-hul) får en stor bonus, så spillet
// oftere giver dig lige den blok, du har brug for.
function pickAdaptiveShape() {
  const regions = getEmptyRegions();

  const scored = SHAPES.map(shape => {
    const placements = allValidPlacements(shape);
    const hasPerfectFit = placements.length > 0 && placements.some(cells =>
      regions.some(region => cellsMatchRegion(cells, region))
    );
    return {shape, placements, hasPerfectFit};
  });

  // Hvis en eller flere former passer PRÆCIST i et tomt rum, vælg altid
  // blandt dem — spillet giver dig med vilje lige den blok, du mangler.
  const perfectFits = scored.filter(s => s.hasPerfectFit);
  if (perfectFits.length > 0) {
    const pick = perfectFits[Math.floor(Math.random() * perfectFits.length)];
    return pick.shape;
  }

  // Ellers: vægt former efter hvor godt de generelt passer på feltet lige nu.
  const candidates = scored
    .filter(s => s.placements.length > 0)
    .map(s => ({shape: s.shape, weight: 3 + Math.min(s.placements.length, 6)}));

  if (candidates.length === 0) {
    return SHAPES[0]; // feltet er stort set fuldt, giv en lille blok
  }

  const totalWeight = candidates.reduce((sum, c) => sum + c.weight, 0);
  let roll = Math.random() * totalWeight;
  for (const c of candidates) {
    roll -= c.weight;
    if (roll <= 0) return c.shape;
  }
  return candidates[candidates.length - 1].shape;
}

function generateTray() {
  tray = [randomShape(), randomShape(), randomShape()];
  renderTray();
  checkGameOver();
}

function renderTray() {
  trayEl.innerHTML = '';
  tray.forEach((piece, idx) => {
    const box = document.createElement('div');
    box.className = 'tray-box' + (piece.used ? ' used' : '');

    const slot = document.createElement('div');
    slot.className = 'piece-slot';
    slot.style.gridTemplateColumns = `repeat(${piece.w}, 20px)`;
    slot.style.gridTemplateRows = `repeat(${piece.h}, 20px)`;

    for (let y = 0; y < piece.h; y++) {
      for (let x = 0; x < piece.w; x++) {
        const has = piece.shape.some(([dx, dy]) => dx === x && dy === y);
        const cell = document.createElement('div');
        cell.className = 'piece-cell' + (has ? '' : ' empty');
        if (has) cell.style.background = piece.color;
        slot.appendChild(cell);
      }
    }

    box.appendChild(slot);

    if (!piece.used) {
      box.addEventListener('pointerdown', (e) => startDrag(e, idx));
    }
    trayEl.appendChild(box);
  });
}

const DRAG_OFFSET_Y = 70;

function startDrag(e, trayIndex) {
  const piece = tray[trayIndex];
  if (!piece || piece.used) return;
  e.preventDefault();

  try {
    e.currentTarget.setPointerCapture(e.pointerId);
  } catch (err) { /* ignorer hvis ikke understøttet */ }

  dragging = {trayIndex, shape: piece.shape, color: piece.color, w: piece.w, h: piece.h};

  const rect = boardEl.getBoundingClientRect();
  const cellSize = rect.width / GRID_SIZE;

  dragCloneEl.innerHTML = '';
  dragCloneEl.style.setProperty('--cell-size', cellSize + 'px');
  dragCloneEl.style.gridTemplateColumns = `repeat(${piece.w}, ${cellSize}px)`;
  dragCloneEl.style.gridTemplateRows = `repeat(${piece.h}, ${cellSize}px)`;
  for (let y = 0; y < piece.h; y++) {
    for (let x = 0; x < piece.w; x++) {
      const has = piece.shape.some(([dx, dy]) => dx === x && dy === y);
      const cell = document.createElement('div');
      cell.className = 'piece-cell' + (has ? '' : ' empty');
      if (has) cell.style.background = piece.color;
      dragCloneEl.appendChild(cell);
    }
  }
  dragCloneEl.style.display = 'grid';
  updateDragPosition(e.clientX, e.clientY);

  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd);
}

function updateDragPosition(clientX, clientY) {
  const rect = boardEl.getBoundingClientRect();
  const cellSize = rect.width / GRID_SIZE;
  const w = dragging.w * cellSize;
  const h = dragging.h * cellSize;
  dragCloneEl.style.left = (clientX - w / 2) + 'px';
  dragCloneEl.style.top = (clientY - DRAG_OFFSET_Y - h / 2) + 'px';
}

function getAnchorFromPointer(clientX, clientY) {
  const rect = boardEl.getBoundingClientRect();
  const cellSize = rect.width / GRID_SIZE;
  const adjX = clientX;
  const adjY = clientY - DRAG_OFFSET_Y;
  const col = Math.round((adjX - rect.left) / cellSize - dragging.w / 2);
  const row = Math.round((adjY - rect.top) / cellSize - dragging.h / 2);
  return {row, col};
}

function getPlacementCells(anchor) {
  return dragging.shape.map(([dx, dy]) => ({r: anchor.row + dy, c: anchor.col + dx}));
}

function isValidPlacement(cells) {
  return cells.every(({r, c}) =>
    r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE && !board[r][c]
  );
}

function clearPreview() {
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      cellEls[r][c].classList.remove('preview-valid', 'preview-invalid', 'line-preview');
    }
  }
}

function getLinesThatWouldClear(cells) {
  const tempFilled = board.map(row => row.map(v => !!v));
  cells.forEach(({r, c}) => { tempFilled[r][c] = true; });

  const rows = [];
  const cols = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    if (tempFilled[r].every(v => v)) rows.push(r);
  }
  for (let c = 0; c < GRID_SIZE; c++) {
    if (tempFilled.every(row => row[c])) cols.push(c);
  }
  return {rows, cols};
}

function onDragMove(e) {
  if (!dragging) return;
  updateDragPosition(e.clientX, e.clientY);

  const anchor = getAnchorFromPointer(e.clientX, e.clientY);
  lastAnchor = anchor;
  const cells = getPlacementCells(anchor);
  const valid = isValidPlacement(cells);

  clearPreview();
  cells.forEach(({r, c}) => {
    if (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE) {
      cellEls[r][c].classList.add(valid ? 'preview-valid' : 'preview-invalid');
    }
  });

  if (valid) {
    const {rows, cols} = getLinesThatWouldClear(cells);
    rows.forEach(r => {
      for (let c = 0; c < GRID_SIZE; c++) cellEls[r][c].classList.add('line-preview');
    });
    cols.forEach(c => {
      for (let r = 0; r < GRID_SIZE; r++) cellEls[r][c].classList.add('line-preview');
    });
  }
}

function onDragEnd(e) {
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  dragCloneEl.style.display = 'none';
  clearPreview();

  if (!dragging) return;

  const anchor = lastAnchor || getAnchorFromPointer(e.clientX, e.clientY);
  const cells = getPlacementCells(anchor);

  if (isValidPlacement(cells)) {
    placePiece(dragging.trayIndex, cells, dragging.color);
  }

  dragging = null;
  lastAnchor = null;
}

function placePiece(trayIndex, cells, color) {
  cells.forEach(({r, c}) => { board[r][c] = color; });
  score += cells.length;

  tray[trayIndex].used = true;
  renderBoard();
  renderTray();

  clearFullLines(cells);
  updateScore();

  if (tray.every(p => p.used)) {
    generateTray();
  } else {
    checkGameOver();
  }
}

const CLEAR_ANIM_DURATION = 240; // ms, skal matche CSS-animationens varighed
const CLEAR_RIPPLE_STEP = 28;    // ms forsinkelse pr. felt-afstand fra placeringen

function clearFullLines(triggerCells) {
  const fullRows = [];
  const fullCols = [];

  for (let r = 0; r < GRID_SIZE; r++) {
    if (board[r].every(v => v)) fullRows.push(r);
  }
  for (let c = 0; c < GRID_SIZE; c++) {
    if (board.every(row => row[c])) fullCols.push(c);
  }

  if (fullRows.length === 0 && fullCols.length === 0) return;

  const clearedCells = new Set();
  fullRows.forEach(r => {
    for (let c = 0; c < GRID_SIZE; c++) clearedCells.add(r + ',' + c);
  });
  fullCols.forEach(c => {
    for (let r = 0; r < GRID_SIZE; r++) clearedCells.add(r + ',' + c);
  });

  // Find hvor langt hvert felt er fra det sted, blokken netop blev placeret,
  // så animationen "bølger" ud derfra i stedet for at ske overalt på samme tid.
  const origin = (triggerCells && triggerCells.length)
    ? triggerCells
    : [{r: Math.floor(GRID_SIZE / 2), c: Math.floor(GRID_SIZE / 2)}];

  function distanceToOrigin(r, c) {
    let best = Infinity;
    origin.forEach(o => {
      const d = Math.max(Math.abs(o.r - r), Math.abs(o.c - c));
      if (d < best) best = d;
    });
    return best;
  }

  let maxDelay = 0;
  clearedCells.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    const delay = distanceToOrigin(r, c) * CLEAR_RIPPLE_STEP;
    if (delay > maxDelay) maxDelay = delay;
    cellEls[r][c].style.animationDelay = delay + 'ms';
    cellEls[r][c].classList.add('clearing');
  });

  const totalLines = fullRows.length + fullCols.length;
  score += totalLines * 10 + (totalLines > 1 ? totalLines * 5 : 0);

  setTimeout(() => {
    clearedCells.forEach(key => {
      const [r, c] = key.split(',').map(Number);
      board[r][c] = null;
      cellEls[r][c].classList.remove('clearing');
      cellEls[r][c].style.animationDelay = '';
    });
    renderBoard();
    updateScore();
  }, maxDelay + CLEAR_ANIM_DURATION);
}

function canPieceFitAnywhere(piece) {
  for (let r = 0; r <= GRID_SIZE - 1; r++) {
    for (let c = 0; c <= GRID_SIZE - 1; c++) {
      const cells = piece.shape.map(([dx, dy]) => ({r: r + dy, c: c + dx}));
      if (isValidPlacementForBoard(cells)) return true;
    }
  }
  return false;
}

function isValidPlacementForBoard(cells) {
  return cells.every(({r, c}) =>
    r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE && !board[r][c]
  );
}

function checkGameOver() {
  const remaining = tray.filter(p => !p.used);
  const canPlaySomething = remaining.some(p => canPieceFitAnywhere(p));
  if (!canPlaySomething) {
    endGame();
  }
}

function endGame() {
  document.getElementById('overlayScore').textContent = 'Point: ' + score;
  overlayEl.style.display = 'flex';
}

startGame();
</script>

</body>
</html>
