<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B10GAMES</title>
<meta name="description" content="B10GAMES – gratis spil direkte i browseren.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-weight='900' font-size='14' fill='%23fff' text-anchor='middle'%3EB10%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #000000;
    --muted: #555555;
    --live: #16a34a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  /* ---------- top ---------- */
  .hero { padding: 48px 0 40px; border-bottom: 2px solid var(--ink); }
  /* Logo with the stats under it. */
  .top { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "logo" "stats"; row-gap: 28px; }
  .hero h1 {
    grid-area: logo;
    font-family: "Archivo Black", sans-serif;
    font-size: clamp(52px, 7.5vw, 96px);
    line-height: .9; letter-spacing: -.03em;
  }
  .hero h1 span { -webkit-text-stroke: 3px var(--ink); color: transparent; }

  .stats { grid-area: stats; align-self: start; display: flex; border: 2px solid var(--ink); width: fit-content; }
  .stat { padding: 12px 22px; }
  .stat + .stat { border-left: 2px solid var(--ink); }
  .stat b { font-family: "Archivo Black", sans-serif; font-size: 26px; display: flex; align-items: center; gap: 8px; line-height: 1.1; }
  .stat small { font: 700 11px "Space Mono", monospace; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--live); display: inline-block; flex: none; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(22,163,74,.6); } 100% { box-shadow: 0 0 0 8px rgba(22,163,74,0); } }

  /* ---------- games ---------- */
  .games { padding: 48px 0 72px; }
  .games-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .games h2 { font-family: "Archivo Black", sans-serif; font-size: clamp(30px, 4vw, 44px); line-height: 1; }
  .search {
    display: flex; align-items: center; gap: 10px; height: 48px; width: min(340px, 100%);
    border: 2px solid var(--ink); background: var(--bg); padding: 0 14px; cursor: text;
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .search:focus-within { transform: translate(-2px,-2px); box-shadow: 4px 4px 0 var(--ink); }
  .search svg { flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 500 16px "Space Grotesk", sans-serif; }
  .search input::placeholder { color: #888; }
  .card[hidden] { display: none; }
  .empty { display: none; font: 700 15px "Space Mono", monospace; padding: 8px 0 24px; }
  .empty.on { display: block; }
  .grid { display: grid; gap: 28px 24px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card {
    border: 2px solid var(--ink); background: var(--bg); position: relative;
    color: inherit; text-decoration: none;
    display: flex; flex-direction: column;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translate(-4px,-4px); box-shadow: 8px 8px 0 var(--ink); }
  .card:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .card img {
    display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover;
    border-bottom: 2px solid var(--ink); background: #eee;
  }
  .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .body h3 { font-family: "Archivo Black", sans-serif; font-size: 24px; line-height: 1.1; }
  .body p { color: var(--muted); font-size: 15px; flex: 1; }
  .cstats {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    font: 700 12px "Space Mono", monospace; border-top: 2px solid var(--ink); padding-top: 10px; margin-top: 4px;
  }
  .cstats span { display: inline-flex; align-items: center; gap: 6px; }
  .cstats .dot { width: 8px; height: 8px; }
  .cstats .off { background: #bbb; animation: none; }
  .play {
    align-self: flex-start;
    font-family: "Space Mono", monospace; font-weight: 700; font-size: 13px; letter-spacing: .06em;
    background: var(--ink); color: var(--bg); padding: 7px 14px;
  }

  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .dot { animation: none; } }
  @media (max-width: 760px) {
    .hero h1 { margin-top: 0; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    .hero { padding: 32px 0 28px; }
    .hero h1 span { -webkit-text-stroke-width: 2px; }
    .grid { grid-template-columns: 1fr; gap: 24px; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="top">
      <h1>B10<span>GAMES</span></h1>
      <div class="stats">
        <div class="stat"><b id="count">0</b><small>Spil</small></div>
        <div class="stat"><b><i class="dot"></i><span id="onlineSite">–</span></b><small>Online nu</small></div>
      </div>
    </div>
  </div>
</header>

<main class="games">
  <div class="wrap">
    <div class="games-head">
      <h2>Alle spil</h2>
      <label class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21" stroke-linecap="square"/></svg>
        <input id="search" type="search" placeholder="Søg efter spil" autocomplete="off" aria-label="Søg efter spil">
      </label>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty">Ingen spil fundet – prøv et andet ord.</p>
  </div>
</main>

<script src="stats.js"></script>
<script>
  // Add a new game here.
  var GAMES = [
    { id: 'bean-of-legends', title: 'Bean of Legends',
      desc: '5 mod 5 bønne-kamp med tre baner, jungle, tårne og minions. Vælg mellem 10 bønner med hver deres fem evner, spil på fem forskellige kort og ødelæg fjendens Bean Core.' },
    { id: 'wobble-dash', title: 'Wobble Dash',
      desc: 'Vaklende 3D-figurer i et forhindringsshow med 10 baner, survival og holdkampe. Lav et party med en kode og spil mod dine venner.' },
    { id: 'apex-horizon', title: 'Apex Horizon',
      desc: 'Superhurtig 3D-racer med 10 racerbaner og en kæmpe åben by. Lav et party med en kode, så dine venner kan køre med.' },
    { id: 'block-storm', title: 'Block Storm',
      desc: 'Træk brikker ind på brættet og ryd rækker. Combos, bomber, drej-brikker og en Blitz-mode på 2 minutter.' },
    { id: 'super-snake', title: 'Super Snake',
      desc: 'Slangen med power-ups, combos, levels, labyrinter og skins du kan låse op.' },
    { id: 'b10-words', title: 'B10 Words',
      desc: 'Gæt det engelske ord på fem bogstaver på seks forsøg. Ét nyt ord hver dag, eller spil frit.' },
    { id: 'matas-surfers', title: 'Matas Surfers',
      desc: 'Løb gennem butikken, hop over soft mud wax, smut under bordet og undvig den kæmpe håndcreme.' },
    { id: 'buttcraft', title: 'Buttcraft',
      desc: 'Voxel-sandkasse i gyldent aftenlys med skygger og vand, der spejler solen. Spil singleplayer eller multiplayer.' },
    { id: 'buttcraft-low-quality', title: 'Buttcraft Low Quality Version',
      desc: 'Den første, simple udgave af Buttcraft. Byg og grav i din egen blokverden og flyv rundt i Creative.' },
    { id: 'turbo-royale', title: 'Turbo Royale',
      desc: 'Ræs med drift og boost, eller kør frit rundt i Free Drive. Vælg sværhedsgrad: easy, medium eller hard.' },
    { id: 'yellow-circle-clicker', title: 'Yellow Circle Clicker',
      desc: 'Klik på cirklen, køb opgraderinger og lav rebirths for en større multiplier.' }
  ];

  (function () {
    function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
    function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    var grid = document.getElementById('grid');
    document.getElementById('count').textContent = GAMES.length;

    var slots = {};
    GAMES.forEach(function (g) {
      var a = el('a', 'card');
      a.href = 'games/' + g.id + '/';
      a.innerHTML =
        '<img src="img/' + g.id + '.jpg" alt="Forsiden af ' + esc(g.title) + '" loading="lazy">' +
        '<div class="body"><h3>' + esc(g.title) + '</h3><p>' + esc(g.desc) + '</p>' +
        '<div class="cstats"><span>▶ <b data-plays>–</b> har spillet</span>' +
        '<span><i class="dot off" data-dot></i><b data-online>–</b> online</span></div>' +
        '<span class="play">SPIL ▶</span></div>';
      grid.appendChild(a);
      slots[g.id] = { card: a, plays: a.querySelector('[data-plays]'), online: a.querySelector('[data-online]'), dot: a.querySelector('[data-dot]') };
    });

    // ---------- most played first ----------
    var plays = {};
    try { plays = JSON.parse(localStorage.getItem('b10-plays')) || {}; } catch (e) {}  // last known numbers, so the order is right at once
    function sortGames() {
      var order = GAMES.slice().sort(function (a, b) {
        return (plays[b.id] || 0) - (plays[a.id] || 0) || GAMES.indexOf(a) - GAMES.indexOf(b);
      });
      var now = Array.prototype.map.call(grid.children, function (c) { return c; });
      var changed = order.some(function (g, i) { return now[i] !== slots[g.id].card; });
      if (changed) order.forEach(function (g) { grid.appendChild(slots[g.id].card); });
    }
    sortGames();

    // ---------- search ----------
    var search = document.getElementById('search'), empty = document.getElementById('empty');
    function filter() {
      var q = search.value.trim().toLowerCase(), shown = 0;
      GAMES.forEach(function (g) {
        var hit = !q || (g.title + ' ' + g.desc).toLowerCase().indexOf(q) !== -1;
        slots[g.id].card.hidden = !hit;
        if (hit) shown++;
      });
      empty.classList.toggle('on', shown === 0);
    }
    search.addEventListener('input', filter);

    // ---------- live numbers ----------
    var S = window.B10Stats;
    function fmt(n) { return n == null ? '–' : n.toLocaleString('da-DK'); }
    function refresh() {
      S.online('site').then(function (n) {
        document.getElementById('onlineSite').textContent = n == null ? '–' : fmt(Math.max(1, n)); // you are online too
      });
      // Play counts first (they decide the order), then who is online.
      Promise.all(GAMES.map(function (g) {
        return S.plays(g.id).then(function (n) {
          if (n == null) return;
          plays[g.id] = n;
          slots[g.id].plays.textContent = fmt(n);
        });
      })).then(function () {
        try { localStorage.setItem('b10-plays', JSON.stringify(plays)); } catch (e) {}
        sortGames();
      });
      GAMES.forEach(function (g) {
        var s = slots[g.id];
        S.online(g.id).then(function (n) {
          if (n == null) return;
          s.online.textContent = fmt(n);
          s.dot.classList.toggle('off', n === 0);
        });
      });
    }
    if (S) { S.startPresence(['site']); refresh(); setInterval(refresh, 60000); }
  })();
</script>
</body>
</html>
