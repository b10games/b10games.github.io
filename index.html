<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B10GAMES</title>
<meta name="description" content="B10GAMES – gratis spil direkte i browseren.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-weight='900' font-size='14' fill='%23fff' text-anchor='middle'%3EB10%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #000000;
    --muted: #555555;
    --live: #16a34a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  /* ---------- top ---------- */
  .hero { padding: 48px 0 40px; border-bottom: 2px solid var(--ink); }
  /* Logo with the stats under it on the left; new games on the right,
     three per row, stacking downward (no sideways scrolling). */
  .top {
    display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto 1fr;
    grid-template-areas: "logo new" "stats new";
    column-gap: 32px; row-gap: 28px;
  }
  .hero h1 {
    grid-area: logo; margin-top: 30px;
    font-family: "Archivo Black", sans-serif;
    font-size: clamp(52px, 7.5vw, 96px);
    line-height: .9; letter-spacing: -.03em;
  }
  .hero h1 span { -webkit-text-stroke: 3px var(--ink); color: transparent; }

  .newbar { grid-area: new; min-width: 0; }
  .newbar[hidden] { display: none; }
  .newlabel { font: 700 12px "Space Mono", monospace; letter-spacing: .14em; margin-bottom: 4px; text-align: right; }
  .newlist {
    display: grid; grid-template-columns: repeat(3, minmax(0, 124px)); justify-content: end;
    gap: 20px 14px; padding: 12px 10px 0 2px;
  }
  .chip {
    border: 2px solid var(--ink); color: inherit; text-decoration: none; background: var(--bg);
    position: relative; transition: transform .15s ease, box-shadow .15s ease;
  }
  .chip:hover { transform: translate(-3px,-3px); box-shadow: 5px 5px 0 var(--ink); }
  .chip img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-bottom: 2px solid var(--ink); }
  .chip span { display: block; font: 700 12px "Space Grotesk", sans-serif; padding: 5px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .new {
    position: absolute; top: -10px; right: -10px; z-index: 2;
    background: var(--ink); color: var(--bg); font: 700 12px "Space Mono", monospace; letter-spacing: .06em;
    padding: 3px 7px; transform: rotate(6deg); border: 2px solid var(--bg); box-shadow: 0 0 0 2px var(--ink);
  }

  .stats { grid-area: stats; align-self: start; display: flex; border: 2px solid var(--ink); width: fit-content; }
  .stat { padding: 12px 22px; }
  .stat + .stat { border-left: 2px solid var(--ink); }
  .stat b { font-family: "Archivo Black", sans-serif; font-size: 26px; display: flex; align-items: center; gap: 8px; line-height: 1.1; }
  .stat small { font: 700 11px "Space Mono", monospace; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--live); display: inline-block; flex: none; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(22,163,74,.6); } 100% { box-shadow: 0 0 0 8px rgba(22,163,74,0); } }

  /* ---------- games ---------- */
  .games { padding: 48px 0 72px; }
  .games h2 { font-family: "Archivo Black", sans-serif; font-size: clamp(30px, 4vw, 44px); line-height: 1; margin-bottom: 28px; }
  .grid { display: grid; gap: 28px 24px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card {
    border: 2px solid var(--ink); background: var(--bg); position: relative;
    color: inherit; text-decoration: none;
    display: flex; flex-direction: column;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translate(-4px,-4px); box-shadow: 8px 8px 0 var(--ink); }
  .card:focus-visible, .chip:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .card img {
    display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover;
    border-bottom: 2px solid var(--ink); background: #eee;
  }
  .card .new { top: -12px; right: -12px; font-size: 15px; padding: 4px 10px; }
  .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .body h3 { font-family: "Archivo Black", sans-serif; font-size: 24px; line-height: 1.1; }
  .body p { color: var(--muted); font-size: 15px; flex: 1; }
  .cstats {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    font: 700 12px "Space Mono", monospace; border-top: 2px solid var(--ink); padding-top: 10px; margin-top: 4px;
  }
  .cstats span { display: inline-flex; align-items: center; gap: 6px; }
  .cstats .dot { width: 8px; height: 8px; }
  .cstats .off { background: #bbb; animation: none; }
  .play {
    align-self: flex-start;
    font-family: "Space Mono", monospace; font-weight: 700; font-size: 13px; letter-spacing: .06em;
    background: var(--ink); color: var(--bg); padding: 7px 14px;
  }

  @media (prefers-reduced-motion: reduce) { .card, .chip { transition: none; } .dot { animation: none; } }
  @media (max-width: 760px) {
    .top { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "logo" "new" "stats"; }
    .hero h1 { margin-top: 0; }
    .newlabel { text-align: left; }
    .newlist { grid-template-columns: repeat(3, minmax(0, 1fr)); justify-content: stretch; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    .hero { padding: 32px 0 28px; }
    .hero h1 span { -webkit-text-stroke-width: 2px; }
    .grid { grid-template-columns: 1fr; gap: 24px; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="top">
      <h1>B10<span>GAMES</span></h1>
      <aside class="newbar" id="newbar" hidden>
        <div class="newlabel">NYE SPIL</div>
        <div class="newlist" id="newList"></div>
      </aside>
      <div class="stats">
        <div class="stat"><b id="count">0</b><small>Spil</small></div>
        <div class="stat"><b><i class="dot"></i><span id="onlineSite">–</span></b><small>Online nu</small></div>
      </div>
    </div>
  </div>
</header>

<main class="games">
  <div class="wrap">
    <h2>Alle spil</h2>
    <div class="grid" id="grid"></div>
  </div>
</main>

<script src="stats.js"></script>
<script>
  // Add a new game here. "added" = the day it came out; it shows as NEW! for 14 days.
  var GAMES = [
    { id: 'apex-horizon', title: 'Apex Horizon', added: '2026-11-09',
      desc: 'Superhurtig 3D-racer i en kæmpe åben by. Drift rundt og lav et party med en kode, så dine venner kan køre med.' },
    { id: 'block-storm', title: 'Block Storm', added: '2026-11-09',
      desc: 'Træk brikker ind på brættet og ryd rækker. Combos, bomber, drej-brikker og en Blitz-mode på 2 minutter.' },
    { id: 'super-snake', title: 'Super Snake', added: '2026-11-09',
      desc: 'Slangen med power-ups, combos, levels, labyrinter og skins du kan låse op.' },
    { id: 'b10-words', title: 'B10 Words', added: '2026-11-09',
      desc: 'Gæt det engelske ord på fem bogstaver på seks forsøg. Ét nyt ord hver dag, eller spil frit.' },
    { id: 'matas-surfers', title: 'Matas Surfers', added: '2026-11-09',
      desc: 'Løb gennem butikken, hop over soft mud wax, smut under bordet og undvig den kæmpe håndcreme.' },
    { id: 'buttcraft', title: 'Buttcraft',
      desc: 'Voxel-sandkasse i gyldent aftenlys med skygger og vand, der spejler solen. Spil singleplayer eller multiplayer.' },
    { id: 'buttcraft-low-quality', title: 'Buttcraft Low Quality Version',
      desc: 'Den første, simple udgave af Buttcraft. Byg og grav i din egen blokverden og flyv rundt i Creative.' },
    { id: 'turbo-royale', title: 'Turbo Royale',
      desc: 'Ræs med drift og boost, eller kør frit rundt i Free Drive. Vælg sværhedsgrad: easy, medium eller hard.' },
    { id: 'yellow-circle-clicker', title: 'Yellow Circle Clicker',
      desc: 'Klik på cirklen, køb opgraderinger og lav rebirths for en større multiplier.' }
  ];
  var NEW_DAYS = 14;

  (function () {
    function isNew(g) {
      if (!g.added) return false;
      var p = g.added.split('-');
      var days = (Date.now() - new Date(+p[0], +p[1] - 1, +p[2]).getTime()) / 86400000;
      return days >= 0 && days < NEW_DAYS;
    }
    function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
    function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    var grid = document.getElementById('grid'), newList = document.getElementById('newList');
    var fresh = GAMES.filter(isNew);
    document.getElementById('count').textContent = GAMES.length;

    fresh.forEach(function (g) {
      var a = el('a', 'chip');
      a.href = 'games/' + g.id + '/';
      a.innerHTML = '<b class="new">NEW!</b><img src="img/' + g.id + '.jpg" alt=""><span>' + esc(g.title) + '</span>';
      newList.appendChild(a);
    });
    document.getElementById('newbar').hidden = !fresh.length;

    var slots = {};
    GAMES.forEach(function (g) {
      var a = el('a', 'card');
      a.href = 'games/' + g.id + '/';
      a.innerHTML =
        (isNew(g) ? '<b class="new">NEW!</b>' : '') +
        '<img src="img/' + g.id + '.jpg" alt="Forsiden af ' + esc(g.title) + '" loading="lazy">' +
        '<div class="body"><h3>' + esc(g.title) + '</h3><p>' + esc(g.desc) + '</p>' +
        '<div class="cstats"><span>▶ <b data-plays>–</b> har spillet</span>' +
        '<span><i class="dot off" data-dot></i><b data-online>–</b> online</span></div>' +
        '<span class="play">SPIL ▶</span></div>';
      grid.appendChild(a);
      slots[g.id] = { plays: a.querySelector('[data-plays]'), online: a.querySelector('[data-online]'), dot: a.querySelector('[data-dot]') };
    });

    // ---------- live numbers ----------
    var S = window.B10Stats;
    function fmt(n) { return n == null ? '–' : n.toLocaleString('da-DK'); }
    function refresh() {
      S.online('site').then(function (n) {
        document.getElementById('onlineSite').textContent = n == null ? '–' : fmt(Math.max(1, n)); // you are online too
      });
      GAMES.forEach(function (g) {
        var s = slots[g.id];
        S.plays(g.id).then(function (n) { if (n != null) s.plays.textContent = fmt(n); });
        S.online(g.id).then(function (n) {
          if (n == null) return;
          s.online.textContent = fmt(n);
          s.dot.classList.toggle('off', n === 0);
        });
      });
    }
    if (S) { S.startPresence(['site']); refresh(); setInterval(refresh, 60000); }
  })();
</script>
</body>
</html>
